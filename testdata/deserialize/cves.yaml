# DESERIALIZATION Z4 control set: real, source-documented deserialization advisories.
#
# role: callback — the advisory's vulnerable code is a callback the format runs on a
#                  created object (reachable only through a deserialization entry);
#       chain    — the component supplies a gadget chain (catalog chain `chain`);
#       entry    — the component is the deserializer itself (its read API).
# expected: what the cited source says, never ariadne's output. `vulnerable` /
#   `fixed` name the releases the source documents. For a chain, `fixed_by` is the
#   change the source names (checked by ariadne as the catalog guard).
# checked_on: the input ariadne's result is compared on (testdata/deserialize/QUALIFICATION.MD).
# internal/deserialize TestDeserializationControlSet checks the vocabulary, that every
# chain exists in the catalog and that every advisory a catalog chain names is here.

cases:
  - id: CVE-2015-7501
    component: commons-collections:commons-collections
    role: chain
    chain: java:commons-collections3:lazymap
    vulnerable: "3.2.1"
    fixed: "3.2.2"
    fixed_by: "InvokerTransformer (and the other unsafe functors) refuse deserialization unless org.apache.commons.collections.enableUnsafeSerialization=true"
    source: "Apache Commons Collections security report (commons.apache.org/proper/commons-collections/security-reports.html), COLLECTIONS-580; ysoserial CommonsCollections6"
    expected: {vulnerable: candidate, fixed: blocked}
    checked_on: scripts/prepare-deserialization-chains-demo.sh
  - id: CVE-2015-7501
    component: org.apache.commons:commons-collections4
    role: chain
    chain: java:commons-collections4:transformingcomparator
    vulnerable: "4.0"
    fixed: "4.1"
    fixed_by: "InvokerTransformer and InstantiateTransformer no longer implement Serializable"
    source: "COLLECTIONS-580 (4.1 release notes); ysoserial CommonsCollections2/4"
    expected: {vulnerable: candidate, fixed: blocked}
    checked_on: scripts/prepare-deserialization-chains-demo.sh
  - id: CVE-2015-4852
    component: commons-collections:commons-collections
    role: chain
    chain: java:commons-collections3:lazymap
    vulnerable: "3.2.1"
    fixed: "3.2.2"
    fixed_by: "the advisory is Oracle WebLogic's (the T3 deserialization entry); the commons-collections chain it uses is the same as CVE-2015-7501's"
    source: "Oracle Security Alert CVE-2015-4852; FoxGlove Security, 2015-11-06"
    expected: {vulnerable: candidate, fixed: blocked}
    checked_on: none (no WebLogic input; the advisory's component is WebLogic, so ariadne links the chain only where OSV reports it for commons-collections)
  - id: CVE-2015-3253
    component: org.codehaus.groovy:groovy
    role: chain
    chain: java:groovy:convertedclosure
    vulnerable: "2.4.3"
    fixed: "2.4.4"
    fixed_by: "MethodClosure#readResolve refuses unless ALLOW_RESOLVE is set; the trigger AnnotationInvocationHandler needs JDK <= 8u71"
    source: "groovy-lang.org/security.html (CVE-2015-3253), GROOVY-7504; ysoserial Groovy1"
    expected: {vulnerable: candidate_if_jdk_8u71_or_older, fixed: blocked}
    checked_on: scripts/prepare-deserialization-chains-demo.sh (with and without -target-java 17)
  - id: CVE-2013-7285
    component: com.thoughtworks.xstream:xstream
    role: entry
    chain: xstream:eventhandler
    vulnerable: "1.4.6"
    fixed: "1.4.7"
    fixed_by: "XStream no longer handles java.beans.EventHandler (ReflectionConverter)"
    source: "x-stream.github.io/CVE-2013-7285.html"
    expected: {vulnerable: candidate, fixed: blocked}
    checked_on: scripts/prepare-deserialization-chains-demo.sh; WebGoat (XStream 1.4.5, vulnerable-components lesson)
  - id: CVE-2023-6378
    component: ch.qos.logback:logback-classic
    role: callback
    vulnerable: "1.2.3"
    fixed: "1.2.13, 1.3.12, 1.4.12"
    fixed_by: "LoggingEventVO#readObject (serialization callback) hardened"
    source: "logback.qos.ch/news.html (2023-11-29, CVE-2023-6378); fix commit in logback 1.2.13/1.3.12"
    expected: {vulnerable: reachable_only_through_a_deserialization_entry}
    checked_on: scripts/prepare-deserialization-demo.sh
  - id: CVE-2021-46877
    component: com.fasterxml.jackson.core:jackson-databind
    role: callback
    vulnerable: "2.10.0–2.12.5, 2.13.0"
    fixed: "2.12.6, 2.13.1"
    fixed_by: "NodeSerialization#readExternal (Externalizable callback) bounds the length it reads"
    source: "GHSA-3x8x-79m2-3w2w; FasterXML jackson-databind issue 3328"
    expected: {vulnerable: reachable_only_through_a_deserialization_entry}
    checked_on: petclinic, WebGoat
