CVE-2022-41853: # HSQLDB: SQL can call any public static Java method (RCE)
  # OSV: org.hsqldb:hsqldb (,2.7.1). No git fix commit (the project is in
  # SVN); checked in the bytecode of 2.0.0, 2.2.9, 2.3.4, 2.5.0, 2.6.1,
  # 2.7.0 and 2.7.1. Every Java routine — CREATE FUNCTION ... EXTERNAL NAME
  # 'CLASSPATH:a.B.m' and a direct CALL "a.B.m"(...) — resolves its class
  # by name in Routine#getMethods (Class.forName + getMethods, public
  # static only) and runs it in Routine#invokeJavaMethod (Method.invoke).
  # 2.7.x gates getMethods on HsqlDatabaseProperties#supportsJavaMethod
  # (property hsqldb.method_class_names); Routine is byte-identical in
  # 2.7.0 and 2.7.1, the fix changed only that gate's properties. Reaching
  # these methods means the database can run Java routines, not that an
  # attacker controls the SQL: that is the exploitability condition.
  role: sink
  coverage: partial
  review: reviewed
  variants:
    - package: org.hsqldb:hsqldb
      versions: "[2.0.0,2.7.1)"
      methods:
        - org.hsqldb.Routine#getMethods
        - org.hsqldb.Routine#invokeJavaMethod

