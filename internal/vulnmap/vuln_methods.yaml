# Manual CVE -> vulnerable-method mapping. This always wins over the
# fix-commit-diff source (see resolve.go): every entry here has been
# checked by hand against its advisory and/or fix commit.
#
# Format: CVE-2021-44228: ["Class#method", ...] — overload-insensitive
# (no descriptor), matching ariadne's convention everywhere else.
# Constructors use "<init>", the name the JVM itself uses.
#
# Object form (CVE:F1b, docs/RESULTS_CONTRACT.MD):
#   CVE-X: {methods: [...], role: vulnerable|entrypoint|sink,
#           coverage: complete_under_declared_assumptions|partial|unknown,
#           review: reviewed|unreviewed}
# The list form stays valid and means coverage partial, review reviewed,
# role unknown.
#
# Schema v2 (CVE:F4) — versioned, optionally with descriptors:
#   CVE-X: {role: ..., coverage: ..., review: ...,
#           variants: [{package: g:a, versions: "[1.0,2.0)",
#                       methods: ["a.B#parse(Ljava/lang/String;)V", ...]}]}
# `versions` is a Maven range; a selector is Class#name (every overload),
# Class#name(params) or Class#name(params)ret (one JVM method). Unknown
# fields, bad ranges and bad descriptors are load errors.
#
# Roles and coverage below follow the CVE:F0 audit
# (testdata/cve-control/MANUAL_MAPPING_AUDIT.MD): no entry is complete.

CVE-2022-1471: # SnakeYAML, unsafe Constructor deserialization (RCE)
  # Versioned (schema v2, CVE:F4): SnakeYAML 2.0 changed the default
  # Constructor (LoaderOptions, restricted global tags), so these entry
  # points describe 1.x only; a 2.x instance gets MAPPING_VERSION_UNCOVERED,
  # never this list.
  role: entrypoint
  coverage: partial
  review: reviewed
  variants:
    - package: org.yaml:snakeyaml
      versions: "(,2.0)"
      methods:
        - org.yaml.snakeyaml.Yaml#load
        - org.yaml.snakeyaml.Yaml#loadAs
        - org.yaml.snakeyaml.Yaml#loadAll
        - org.yaml.snakeyaml.constructor.Constructor#<init>

CVE-2021-44228: # Log4Shell
  # Migrated to schema v2 (CVE:F9b). OSV: log4j-core [2.0-beta9,2.3.1),
  # [2.4,2.12.2), [2.13.0,2.15.0). Checked in the bytecode of 17 releases
  # (2.0-beta9, -rc1, -rc2, 2.0, 2.0.1, 2.0.2, 2.1, 2.2, 2.3, 2.3.1, 2.8.2,
  # 2.11.1, 2.12.1, 2.12.2, 2.13.0, 2.14.1, 2.15.0): up to 2.0.2 JndiLookup
  # declares both lookup(String) and lookup(LogEvent, String); from 2.1 it
  # extends AbstractLookup, whose lookup(String) delegates to the
  # LogEvent overload, and declares only that one.
  role: sink
  coverage: partial
  review: reviewed
  variants:
    - package: org.apache.logging.log4j:log4j-core
      versions: "[2.0-beta9,2.1)"
      methods:
        - org.apache.logging.log4j.core.lookup.JndiLookup#lookup(Ljava/lang/String;)Ljava/lang/String;
        - org.apache.logging.log4j.core.lookup.JndiLookup#lookup(Lorg/apache/logging/log4j/core/LogEvent;Ljava/lang/String;)Ljava/lang/String;
    - package: org.apache.logging.log4j:log4j-core
      versions: "[2.1,2.15.0)"
      methods:
        - org.apache.logging.log4j.core.lookup.JndiLookup#lookup(Lorg/apache/logging/log4j/core/LogEvent;Ljava/lang/String;)Ljava/lang/String;

CVE-2022-42889: # Text4Shell
  # Migrated to schema v2 (CVE:F9b). OSV: commons-text [1.5,1.10.0).
  # Checked in the bytecode of 1.4–1.10.0: StringSubstitutor declares the
  # same 14 replace overloads in every release. The 11 instance overloads
  # are the entry points (an interpolating substitutor's replace runs the
  # script/dns/url lookups); the 3 static replace(Object, Map|Properties…)
  # build a substitutor over a plain map lookup and are left out — the
  # name-only selector used before matched them too.
  role: entrypoint
  coverage: partial
  review: reviewed
  variants:
    - package: org.apache.commons:commons-text
      versions: "[1.5,1.10.0)"
      methods:
        - org.apache.commons.text.StringSubstitutor#replace(Ljava/lang/String;)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace(Ljava/lang/String;II)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace(Ljava/lang/CharSequence;)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace(Ljava/lang/CharSequence;II)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace(Ljava/lang/Object;)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace(Ljava/lang/StringBuffer;)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace(Ljava/lang/StringBuffer;II)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace(Lorg/apache/commons/text/TextStringBuilder;)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace(Lorg/apache/commons/text/TextStringBuilder;II)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace([C)Ljava/lang/String;
        - org.apache.commons.text.StringSubstitutor#replace([CII)Ljava/lang/String;

# XStream (WebGoat's control case). An unconfigured XStream's
# fromXML/fromXML-family entry points are the shared attack surface for
# essentially every one of these — each CVE is a different gadget chain
# reachable through the same deserialization call, which is also exactly
# why they share one set of vulnerable methods here rather than each
# getting a distinct, gadget-specific method list. The exact CVE ids
# below are every XStream 1.4.5 vulnerability OSV reported when ariadne
# ran against the real WebGoat dependency set (see PLAN.md Phase 2).
CVE-2013-7285: &xstream-entry-points
  role: entrypoint
  coverage: partial
  review: reviewed
  methods:
    - com.thoughtworks.xstream.XStream#fromXML
    - com.thoughtworks.xstream.XStream#unmarshal
