# ---------------------------------------------------------------------------
# Advisories with no usable fix commit and no class name (CVE:F10 follow-up,
# 2026-11-13). Each list comes from a release diff by hand: the normalized
# bytecode (classfile.MethodFingerprint) of the last release before the fix
# against the fixing release, read in full and attributed to the advisory by
# its text. Every method is then checked by name in the bytecode of the
# releases each variant names (`checked:` in the comments); a version outside
# a variant gets MAPPING_VERSION_UNCOVERED, never a guess. The 2026 Spring
# advisories were fixed only in 6.2.x/7.0.x on Maven Central (5.3.x fixes are
# commercial), so the methods are taken from the 6.2 diff and their 5.3/6.0/
# 6.1 counterparts are the same-named methods of the same classes.

# SnakeYAML: stack overflow while composing deeply nested untrusted YAML.
