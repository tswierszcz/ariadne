# Spring (Spring Boot) profile — PLAN.md section 4's own example, plus
# the Phase 5 "observed limitation" fix: spring-beans/spring-core/
# spring-expression/spring-aop added to framework_packages, since several
# real petclinic REACHABLE paths routed through Spring Beans/SpEL
# internals (CachedIntrospectionResults, SpelExpression, ...) that were
# arguably framework-mediated rather than genuine app-code reachability,
# and the original seed list only named spring-web/spring-webmvc/
# spring-boot:*.
name: spring
detect:
  - org.springframework.boot.SpringApplication
  - org.springframework.context.ApplicationContext
roots:
  annotations:
    - org.springframework.web.bind.annotation.RequestMapping
    - org.springframework.web.bind.annotation.GetMapping
    - org.springframework.web.bind.annotation.PostMapping
    - org.springframework.web.bind.annotation.PutMapping
    - org.springframework.web.bind.annotation.DeleteMapping
    - org.springframework.web.bind.annotation.PatchMapping
    - org.springframework.scheduling.annotation.Scheduled
    # A method with two @Scheduled holds only their @Repeatable container
    # in the class file (testdata/events, spring:events oracle).
    - org.springframework.scheduling.annotation.Schedules
    - org.springframework.context.event.EventListener
    - org.springframework.context.annotation.Bean
    # Message listeners: the broker's listener container calls them
    # (through MessagingMessageListenerAdapter → InvocableHandlerMethod →
    # Method#invoke) — entry points like an HTTP mapping. A class-level
    # @KafkaListener/@RabbitListener makes its public methods roots (its
    # @KafkaHandler/@RabbitHandler methods among them); the @Repeatable
    # containers are what a method with two listener annotations holds.
    - org.springframework.jms.annotation.JmsListener
    - org.springframework.jms.annotation.JmsListeners
    - org.springframework.kafka.annotation.KafkaListener
    - org.springframework.kafka.annotation.KafkaListeners
    - org.springframework.kafka.annotation.KafkaHandler
    - org.springframework.amqp.rabbit.annotation.RabbitListener
    - org.springframework.amqp.rabbit.annotation.RabbitListeners
    - org.springframework.amqp.rabbit.annotation.RabbitHandler
  overrides: []
  main: true
  # The container's reflective calls into its beans: the constructor it
  # picks, injection methods, @PostConstruct/@PreDestroy, a @Bean's
  # initMethod/destroyMethod (ROADMAP B4 b4-7, testdata/di).
  beans: true
framework_packages:
  - org.apache.tomcat.embed:*
  - org.springframework:spring-web
  - org.springframework:spring-webmvc
  - org.springframework.boot:*
  - org.springframework:spring-beans
  - org.springframework:spring-core
  - org.springframework:spring-expression
  - org.springframework:spring-aop
  # spring-tx: since framework:proxies x3 a transactional call enters
  # TransactionInterceptor, and CHA inside spring-tx (synchronizations,
  # transaction managers) reaches far more than an application runs — the
  # same "framework-mediated, review by hand" treatment as beans/core/aop.
  - org.springframework:spring-tx
  - org.hibernate:*
  - ch.qos.logback:*
  - org.apache.logging.log4j:*
  - pkg: com.fasterxml.jackson.core:jackson-databind
    when_annotation:
      - org.springframework.web.bind.annotation.RequestBody
      - org.springframework.web.bind.annotation.ResponseBody
      - org.springframework.web.bind.annotation.RestController
synthetic_edges:
  - from_subtypes_of: org.springframework.data.repository.Repository
    to: org.springframework.data.jpa.repository.support.SimpleJpaRepository
