# Micronaut profile (PLAN.md section 4's "Later profiles (Phase 7): ...
# micronaut, quarkus" entry).
#
# Like spring.yaml/jakarta.yaml, roots.annotations lists only the
# HTTP-verb/scheduling annotations (@Get/@Post/.../@Scheduled/
# @EventListener), never @Controller itself: @Controller is class-level
# only (confirmed via javap: @Target(TYPE, ANNOTATION_TYPE)), and the
# class-level rule ("every public method of a class carrying one of
# these becomes a root") would then wrongly turn every public helper
# method of a controller class into an entry point, not just the ones
# actually exposed as routes (which always also carry an HTTP-verb
# annotation). Confirmed these annotations are real RUNTIME-retention
# RuntimeVisibleAnnotations (via javap on the published jar), not a
# compile-time-only marker internal/classfile would never see.
#
# No synthetic_edges, unlike spring.yaml's Spring-Data bridge: Micronaut
# Data repository interfaces (io.micronaut.data.repository.CrudRepository
# and friends) get their implementation generated by Micronaut's own
# annotation processor *at compile time*, as a real class in the app's
# own compiled output -- not a JDK runtime proxy with zero bytecode the
# way Spring Data's are. CHA already finds that generated implementation
# like any other subtype, with nothing to bridge.
name: micronaut
detect:
  - io.micronaut.context.ApplicationContext
  - io.micronaut.runtime.Micronaut
roots:
  annotations:
    - io.micronaut.http.annotation.Get
    - io.micronaut.http.annotation.Post
    - io.micronaut.http.annotation.Put
    - io.micronaut.http.annotation.Delete
    - io.micronaut.http.annotation.Patch
    - io.micronaut.http.annotation.Head
    - io.micronaut.http.annotation.Options
    - io.micronaut.scheduling.annotation.Scheduled
    - io.micronaut.runtime.event.annotation.EventListener
  overrides: []
  main: true
framework_packages:
  - io.micronaut:*
  - io.netty:*
synthetic_edges: []
